;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;
;;  Visual Leak Detector - Initialization/Configuration File (test config)
;;
;;  Config for heapmaplock_deadlock_test: SkipCrtStartupLeaks makes
;;  VLDGetLeaksCount resolve call stacks; the fast stack walk keeps dbghelp out
;;  of the allocation hook.
;;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[Options]
VLD = on
ReportTo = stdout
StackWalkMethod = fast
SkipCrtStartupLeaks = yes
